<!doctype html>
<html lang="ar" dir="rtl" class="top-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيادة د. محمود دويكات لطب الأسنان</title>
<meta name="description" content="عيادة د. محمود دويكات لطب وتجميل الأسنان: فحص وتنظيف، تبييض، تقويم شفاف وزراعة. احجز موعدك عبر واتساب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pearl:#F5F7F5; --surface:#FFFFFF; --ink:#0E2230; --muted:#5A6A73; --line:rgba(14,34,48,.11);
  --night:#0A1A26; --night-2:#112838; --on-night:#EAF3F3; --night-muted:#9DB4BC;
  --aqua:#7FE0D6; --aqua-deep:#0E8F8A; --coral:#E8707A; --on-coral:#FFFFFF; --blush:#FBE4E6;
  --display:'Alexandria','Segoe UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
html,body{overflow-x:clip;max-width:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{margin:0;background:var(--pearl);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--pearl);transition:background .3s}
html.top-dark body::before{background:var(--night)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--coral);outline-offset:3px;border-radius:8px}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:0}
h2{font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.3;font-weight:700}
.lead{color:var(--muted);max-width:36em;margin:14px 0 0}
section{padding-block:clamp(72px,10vw,128px)}

/* buttons */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:15px 28px;font-family:var(--display);font-weight:600;font-size:16px;text-decoration:none;border:2px solid currentColor;background:none;transition:transform .15s,color .35s,border-color .35s}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--ink);transform:translateY(102%);transition:transform .45s cubic-bezier(.7,0,.2,1);z-index:-1}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.btn.primary::before{background:#d65864}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover::before{transform:none}.btn:not(.primary):hover{color:var(--pearl);border-color:var(--ink)}}
.on-night .btn:not(.primary){color:var(--on-night)}
.on-night .btn:not(.primary)::before{background:var(--on-night)}
@media (hover:hover){.on-night .btn:not(.primary):hover{color:var(--night);border-color:var(--on-night)}}
.btn svg{width:20px;height:20px;flex:none}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--pearl) 96%,transparent);border-bottom:1px solid var(--line);transition:background .35s,border-color .35s,color .35s}
.site-header.on-dark{background:transparent;border-color:transparent;color:var(--on-night);backdrop-filter:none;-webkit-backdrop-filter:none}
.bar{display:flex;align-items:center;gap:28px;height:74px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25}
.brand svg{width:36px;height:36px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;opacity:.7}
.nav{display:flex;gap:24px;margin-inline-start:auto;font-size:15px}
.nav a{text-decoration:none;opacity:.72;transition:opacity .2s}
.nav a:hover{opacity:1}
.bar .btn{padding:10px 20px;font-size:15px}
.burger{display:none;margin-inline-start:auto;width:46px;height:46px;border-radius:50%;border:2px solid currentColor;background:none;padding:0}
.burger span{display:block;width:18px;height:2px;background:currentColor;margin:4px auto;border-radius:2px}
@media (max-width:1080px){.nav,.bar .btn{display:none}.burger{display:grid;align-content:center}}

/* menu */
.menu{position:fixed;inset:0;z-index:60;background:var(--night);color:var(--on-night);display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));visibility:hidden}
.menu.open{visibility:visible}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu-close{border:2px solid currentColor;background:none;border-radius:999px;padding:8px 18px;font-size:15px}
.menu nav{display:grid;gap:4px;margin-block:auto}
.menu nav a{font-family:var(--display);font-weight:700;font-size:clamp(2rem,9vw,3rem);line-height:1.5;text-decoration:none;display:block}
.menu .btn{color:var(--on-coral)}

/* hero */
.hero{position:relative;background:var(--night);color:var(--on-night);padding-block:clamp(8px,3vw,40px) 0;margin-top:-75px;padding-top:calc(75px + clamp(8px,3vw,40px));overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:70vmax;height:70vmax;background:radial-gradient(closest-side,rgba(127,224,214,.18),transparent 70%);pointer-events:none}
.hero-grid{position:relative;display:grid;gap:8px;align-items:center}
@media (min-width:960px){.hero-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:min(760px,calc(100vh - 74px))}}
.hero h1{font-size:clamp(2.4rem,5.8vw,4.5rem);line-height:1.28;font-weight:800}
.hero .lead{color:var(--night-muted);font-size:clamp(1.02rem,1.6vw,1.15rem)}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.trust{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14px;color:var(--night-muted)}
.trust li{display:flex;align-items:center;gap:8px}
.trust svg{width:18px;height:18px;color:var(--aqua);flex:none}
.hero-3d{position:relative;height:clamp(320px,52vw,640px);order:-1}
@media (min-width:960px){.hero-3d{order:0;height:100%;min-height:560px}}
.hero-3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.hero-3d .glow{position:absolute;inset:12% 12%;border-radius:50%;background:radial-gradient(closest-side,rgba(127,224,214,.35),rgba(127,224,214,.08) 60%,transparent);filter:blur(10px)}
.hero-3d .fallback{position:absolute;inset:14%;display:none}
.hero-3d.no3d .fallback{display:block}
.spark{position:absolute;width:22px;height:22px;color:#fff;pointer-events:none}
.smile-edge{display:block;width:100%;height:clamp(50px,8vw,110px);margin-top:clamp(10px,3vw,30px)}
.smile-edge path{fill:var(--pearl)}

/* compare */
.compare-grid{display:grid;gap:clamp(28px,4vw,64px);align-items:center}
@media (min-width:960px){.compare-grid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}
.smile{position:relative;background:linear-gradient(160deg,var(--blush),color-mix(in srgb,var(--aqua) 22%,var(--pearl)));border-radius:36px;padding:clamp(18px,3vw,40px) clamp(8px,2vw,24px) 70px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.smile svg{display:block;width:100%;height:auto;overflow:visible}
.smile-tag{position:absolute;bottom:20px;font-family:var(--display);font-weight:600;font-size:14px;padding:7px 15px;border-radius:999px;background:var(--surface);color:var(--ink)}
.smile-tag.before{right:20px}
.smile-tag.after{left:20px;background:var(--night);color:var(--on-night)}
.smile input{position:absolute;width:1px;height:1px;opacity:0}
.smile:focus-within{outline:2.5px solid var(--coral);outline-offset:4px}
.compare-copy ul{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:12px}
.compare-copy li{display:flex;gap:12px;align-items:flex-start}
.compare-copy li svg{width:22px;height:22px;color:var(--aqua-deep);flex:none;margin-top:5px}

/* tooth story */
.story{display:grid;gap:0 clamp(24px,5vw,72px);margin-top:clamp(20px,3vw,32px)}
@media (min-width:960px){.story{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}}
.story-visual{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);z-index:2;height:min(46vh,420px);padding-block:6px;background:var(--pearl)}
@media (min-width:960px){.story-visual{top:104px;height:calc(100vh - 140px);max-height:640px}}
.xray{position:relative;height:100%;border-radius:32px;background:radial-gradient(120% 90% at 50% 30%,var(--night-2),var(--night));overflow:hidden;display:grid;place-items:center}
.xray::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(127,224,214,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(127,224,214,.07) 1px,transparent 1px);background-size:28px 28px}
.xray::after{content:"";position:absolute;inset-inline:0;top:0;height:30%;background:linear-gradient(to bottom,transparent,rgba(127,224,214,.16),transparent);animation:scan 3.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(340%)}}
.xray svg{position:relative;width:100%;height:100%;max-width:560px;overflow:visible}
.xray-tag{position:absolute;top:16px;right:18px;font-size:12px;color:var(--aqua);font-family:var(--display);font-weight:600;display:flex;align-items:center;gap:8px;z-index:1}
.xray-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.story-group{font-family:var(--display);font-weight:700;font-size:15px;color:var(--aqua-deep);margin:48px 0 0}
.story-step{min-height:54vh;display:flex;align-items:center}
@media (min-width:960px){.story-step{min-height:70vh}}
.story-card{background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:24px 26px;max-width:30em;opacity:.42;transition:opacity .4s,transform .6s cubic-bezier(.3,1.5,.5,1),border-color .3s,box-shadow .4s}
.story-step.on .story-card{opacity:1;border-color:var(--aqua-deep);transform:scale(1.03);box-shadow:0 18px 50px -24px rgba(14,143,138,.45)}
.story-card h3{font-size:1.45rem;font-weight:700;margin-bottom:6px;line-height:1.4}
.story-card p{margin:0;color:var(--muted)}
.lbl-text{font-family:var(--display);font-weight:700;font-size:20px;fill:#EAF3F3}
.lbl-line{stroke:var(--aqua);stroke-width:2;fill:none}
.lbl-dot{fill:var(--coral)}
.L-hl{transition:filter .4s}

/* process */
.process{background:var(--night);color:var(--on-night)}
.process .lead{color:var(--night-muted)}
.steps{position:relative;margin-top:clamp(36px,5vw,56px);display:grid;gap:clamp(28px,4vw,44px);padding-inline-start:84px}
.track{position:absolute;top:8px;bottom:8px;inset-inline-start:27px;width:3px;border-radius:3px;background:rgba(234,243,243,.14)}
.track-fill{position:absolute;inset:0;background:linear-gradient(var(--aqua),var(--coral));border-radius:3px;transform-origin:top;transform:scaleY(0)}
.step{position:relative}
.step-num{position:absolute;inset-inline-start:-84px;top:-6px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;background:var(--night);border:3px solid rgba(234,243,243,.22);transition:background .35s,border-color .35s,color .35s}
.step.on .step-num{background:var(--aqua);border-color:var(--aqua);color:var(--night)}
.step h3{font-size:clamp(1.25rem,2.4vw,1.6rem);font-weight:700;line-height:1.4}
.step p{margin:6px 0 0;max-width:34em;color:var(--night-muted)}

/* brushing */
.brush-sec{background:linear-gradient(180deg,var(--pearl),color-mix(in srgb,var(--aqua) 14%,var(--pearl)))}
.brush-grid{display:grid;gap:clamp(28px,4vw,56px);align-items:center;margin-top:clamp(28px,4vw,44px)}
@media (min-width:960px){.brush-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}}
.brush-panel{background:var(--surface);border-radius:32px;padding:clamp(12px,3vw,28px);box-shadow:0 30px 60px -40px rgba(14,34,48,.35)}
.brush-panel svg{display:block;width:100%;height:auto;overflow:visible}
.timer{display:flex;align-items:center;gap:18px;margin-top:20px;flex-wrap:wrap}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--aqua-deep);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:23px;direction:ltr}
.timer-info{flex:1;min-width:150px}
.timer-info strong{display:block;font-family:var(--display);font-size:1.1rem;line-height:1.5}
.timer-info span{color:var(--muted);font-size:15px}
.tips{list-style:none;margin:0;padding:0;counter-reset:t;display:grid;gap:20px}
.tips li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start}
.tips li::before{counter-increment:t;content:counter(t);width:44px;height:44px;border-radius:50%;background:var(--night);color:var(--aqua);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.tips b{font-family:var(--display);display:block}
.tips span{color:var(--muted)}

/* sugar */
.sugar-card{background:var(--surface);border-radius:32px;padding:clamp(16px,3vw,32px);margin-top:clamp(28px,4vw,44px);box-shadow:0 30px 60px -40px rgba(14,34,48,.3)}
.sugar-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px}
.seg{position:relative;display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--pearl)}
.seg button{position:relative;z-index:1;border:0;background:none;border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:600;font-size:15px;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--pearl)}
.seg-pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--ink)}
.danger{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.4}
.danger b{display:inline-block;font-size:2.4rem;color:var(--coral);font-weight:800;margin-inline-end:6px;vertical-align:middle}
.chart{display:block;width:100%;height:auto}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart text{font-family:var(--body);font-size:13px;fill:var(--muted)}
.chart .zone{fill:var(--blush)}
.chart .crit{stroke:var(--coral);stroke-width:1.5;stroke-dasharray:6 6}
.chart .curve{fill:none;stroke:var(--aqua-deep);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.chart .curve.hot{stroke:var(--coral);stroke-width:4.5}
.chart .area{fill:url(#areaGrad);opacity:.5}
.chart .ev{fill:var(--coral)}
.note-small{font-size:13px;color:var(--muted);margin:10px 0 0}

/* habits */
.habits{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:clamp(22px,3vw,36px);margin-top:clamp(28px,4vw,48px)}
.habit{position:relative;padding-top:18px}
.habit::before{content:"";position:absolute;top:0;inset-inline:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--coral),var(--aqua-deep));transform-origin:right;transform:scaleX(var(--s,1))}
.habit .n{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,9vw,5.8rem);line-height:1.1;color:var(--ink);display:inline-block}
.habit .u{font-family:var(--display);font-weight:700;font-size:1.2rem;margin-inline-start:8px;color:var(--aqua-deep)}
.habit p{margin:8px 0 0;color:var(--muted)}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:0 56px;margin-top:clamp(32px,5vw,52px)}
.svc-item{display:grid;grid-template-columns:60px minmax(0,1fr);gap:18px;align-items:start;padding:24px 0;border-top:1px solid var(--line)}
.svc-icon{width:60px;height:60px;border-radius:20px;background:var(--night);color:var(--aqua);display:grid;place-items:center}
.svc-icon svg{width:32px;height:32px}
.svc-icon path,.svc-icon circle{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.svc-item h3{font-size:1.2rem;font-weight:700;line-height:1.5}
.svc-item p{margin:4px 0 0;color:var(--muted);font-size:16px}

/* doctor */
.doctor{display:grid;gap:clamp(28px,5vw,72px);align-items:center;margin-top:clamp(28px,4vw,48px)}
@media (min-width:860px){.doctor{grid-template-columns:auto minmax(0,1fr)}}
.avatar{position:relative;width:clamp(200px,28vw,300px);aspect-ratio:1;margin-inline:auto}
.avatar svg{position:absolute;inset:0;width:100%;height:100%}
.avatar .face{position:absolute;inset:14%;border-radius:50%;background:linear-gradient(150deg,var(--night-2),var(--night));color:var(--aqua);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,5vw,3.6rem)}
.avatar .orbit{animation:spin 18s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.doctor h3{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:800;line-height:1.3}
.doctor .role{color:var(--aqua-deep);font-family:var(--display);font-weight:600;margin:4px 0 0}
.doctor .bio{color:var(--muted);max-width:34em;margin:16px 0 24px}

/* reviews */
.reviews{background:var(--surface)}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(24px,4vw,48px);margin-top:clamp(32px,5vw,52px)}
.quote{margin:0;position:relative}
.quote svg{width:44px;height:44px;color:var(--coral)}
.quote blockquote{margin:10px 0 14px;font-family:var(--display);font-weight:600;font-size:clamp(1.15rem,2vw,1.35rem);line-height:1.75}
.quote figcaption{color:var(--muted);font-size:15px}
.stars{color:#F2B630;letter-spacing:2px;font-size:15px}

/* faq */
.faq-list{margin-top:clamp(28px,4vw,44px);max-width:840px}
.faq-item{border-top:1px solid var(--line)}
.faq-item:last-child{border-bottom:1px solid var(--line)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:right;background:none;border:0;padding:22px 0;font-family:var(--display);font-weight:600;font-size:clamp(1.05rem,2vw,1.2rem);line-height:1.5}
.faq-plus{flex:none;width:38px;height:38px;border-radius:50%;background:var(--night);color:var(--aqua);display:grid;place-items:center;transition:transform .45s cubic-bezier(.3,1.6,.5,1),background .25s,color .25s}
.faq-item.open .faq-plus{transform:rotate(135deg);background:var(--coral);color:#fff}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.faq-item.open .faq-a{grid-template-rows:1fr}
.faq-a > div{overflow:hidden}
.faq-a p{margin:0 0 22px;color:var(--muted);max-width:40em}

/* booking */
.book{background:var(--night);color:var(--on-night)}
.book .lead{color:var(--night-muted)}
.book-grid{display:grid;gap:clamp(28px,4vw,56px)}
@media (min-width:960px){.book-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}}
.card{background:var(--surface);color:var(--ink);border-radius:32px;padding:clamp(22px,3.4vw,40px)}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.field{display:grid;gap:8px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lbl{font-family:var(--display);font-weight:600;font-size:14px}
input,select,textarea{font:inherit;font-size:16px;width:100%;max-width:100%;min-width:0;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--pearl);color:var(--ink);transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--aqua-deep)}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-height:52px;text-align:start}
input::-webkit-date-and-time-value{text-align:start}
textarea{resize:vertical;min-height:90px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--pearl);border-radius:999px;padding:10px 18px;font-size:15px;transition:background .2s,color .2s,border-color .2s}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--pearl)}
.form-error{grid-column:1/-1;margin:0;color:var(--coral);font-weight:600}
.form .btn{grid-column:1/-1}
.sent{text-align:center;padding:12px 0}
.sent svg{width:80px;height:80px}
.sent circle,.sent path{fill:none;stroke:var(--aqua-deep);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sent h3{font-size:1.5rem;margin:14px 0 8px}
.sent pre{text-align:right;white-space:pre-wrap;font:inherit;font-size:15px;background:var(--pearl);border-radius:18px;padding:16px 18px;margin:16px 0}
.sent .note{font-size:14px;color:var(--muted);margin:0 0 18px}
.info{display:grid;gap:24px}
.info h3{font-size:1.15rem;font-weight:700;margin-bottom:6px}
.hours{list-style:none;margin:0;padding:0}
.hours li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid rgba(234,243,243,.12)}
.hours li span:last-child{color:var(--night-muted)}
.info p{margin:0 0 14px;color:var(--night-muted)}
.info-actions{display:flex;flex-wrap:wrap;gap:10px}

.foot{background:var(--night);color:var(--night-muted);border-top:1px solid rgba(234,243,243,.1);padding-block:28px 110px;font-size:14px}
.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.wa{position:fixed;z-index:35;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.28);transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.wa.show{transform:scale(1)}
.wa svg{width:30px;height:30px}


/* ===== palettes (default = lilac) ===== */
:root,html[data-palette="blue"]{
  --pearl:#F1F8FF; --ink:#0A2540; --muted:#536B85; --line:rgba(10,37,64,.12);
  --night:#0B3A66; --night-2:#125A9A; --on-night:#EEF7FF; --night-muted:#B3D4F2;
  --aqua:#8ED4FF; --aqua-deep:#1488DB; --coral:#FFC93C; --on-coral:#0A2540; --blush:#DCEFFF;
}
html[data-palette="mint"]{
  --pearl:#F1FAF6; --ink:#0B3A31; --muted:#4F6E66; --line:rgba(11,58,49,.12);
  --night:#0B3A31; --night-2:#125041; --on-night:#EFFBF6; --night-muted:#A6CFC2;
  --aqua:#8AF2CC; --aqua-deep:#0FA374; --coral:#FF6B6B; --on-coral:#FFFFFF; --blush:#DDF5EA;
}
html[data-palette="sky"]{
  --pearl:#F3F7FF; --ink:#0B2545; --muted:#55657F; --line:rgba(11,37,69,.12);
  --night:#0B2545; --night-2:#14386A; --on-night:#EEF4FF; --night-muted:#A9BCDB;
  --aqua:#9CC2FF; --aqua-deep:#2D6BFF; --coral:#FFC93C; --on-coral:#0B2545; --blush:#E1ECFF;
}
html[data-palette="peach"]{
  --pearl:#FFF6F1; --ink:#3B1E24; --muted:#7A5A5E; --line:rgba(59,30,36,.12);
  --night:#3B1E24; --night-2:#572931; --on-night:#FFF3EE; --night-muted:#E3BDB5;
  --aqua:#FFB9A8; --aqua-deep:#E0485F; --coral:#2EC4B6; --on-coral:#FFFFFF; --blush:#FFE6DD;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --pearl:#13111C; --surface:#1C1929; --ink:#EEEAF7; --muted:#ABA5C2; --line:rgba(238,234,247,.12); --blush:#262139; color-scheme:dark; }
}
:root[data-theme="dark"]{ --pearl:#13111C; --surface:#1C1929; --ink:#EEEAF7; --muted:#ABA5C2; --line:rgba(238,234,247,.12); --blush:#262139; color-scheme:dark; }

.brand svg{color:var(--aqua-deep)}
.on-dark .brand svg,.menu .brand svg{color:var(--aqua)}
.hero::before{background:radial-gradient(closest-side,color-mix(in srgb,var(--aqua) 30%,transparent),transparent 70%)}
.hero-3d .glow{background:radial-gradient(closest-side,color-mix(in srgb,var(--aqua) 45%,transparent),color-mix(in srgb,var(--aqua) 10%,transparent) 60%,transparent)}
.xray::before{background-image:linear-gradient(color-mix(in srgb,var(--aqua) 10%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--aqua) 10%,transparent) 1px,transparent 1px)}
.xray::after{background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--aqua) 22%,transparent),transparent)}
.hl path,.hl rect{stroke:var(--aqua)!important}
.h-knob{fill:var(--night)} .h-arrow{stroke:var(--aqua)}
.brush-handle{fill:var(--coral)}
#areaGrad stop{stop-color:var(--aqua-deep)}
#rg stop:first-child{stop-color:var(--coral)} #rg stop:last-child{stop-color:var(--aqua-deep)}
.orbit circle:first-child{stroke:var(--aqua)} .orbit circle:last-child{fill:var(--coral)}
.story-step.on .story-card{box-shadow:0 18px 50px -24px color-mix(in srgb,var(--aqua-deep) 55%,transparent)}

/* animated page background (follows palette) */
.bg-mesh,.bg-mesh::before,.bg-mesh::after{position:absolute;inset:-12vmax;pointer-events:none;will-change:transform}
.bg-mesh{background:
  radial-gradient(30vmax 30vmax at 18% 26%,color-mix(in srgb,var(--aqua) 75%,transparent),transparent 70%),
  radial-gradient(26vmax 26vmax at 82% 62%,color-mix(in srgb,var(--aqua-deep) 30%,transparent),transparent 70%);
  animation:meshA 14s ease-in-out infinite alternate}
.bg-mesh::before{content:"";inset:0;background:
  radial-gradient(24vmax 24vmax at 70% 20%,color-mix(in srgb,var(--blush) 100%,transparent),transparent 70%),
  radial-gradient(22vmax 22vmax at 30% 80%,color-mix(in srgb,var(--coral) 35%,transparent),transparent 70%);
  animation:meshB 11s ease-in-out infinite alternate}
.bg-mesh::after{content:"";inset:0;background:
  radial-gradient(20vmax 20vmax at 50% 50%,color-mix(in srgb,var(--aqua) 55%,transparent),transparent 70%),
  radial-gradient(16vmax 16vmax at 88% 18%,color-mix(in srgb,var(--aqua-deep) 25%,transparent),transparent 70%);
  animation:meshC 17s ease-in-out infinite alternate}
@keyframes meshA{0%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}50%{transform:translate3d(12vmax,-8vmax,0) rotate(25deg) scale(1.15)}100%{transform:translate3d(-10vmax,10vmax,0) rotate(-20deg) scale(.9)}}
@keyframes meshB{0%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(-14vmax,9vmax,0) rotate(-30deg)}100%{transform:translate3d(10vmax,-12vmax,0) rotate(35deg)}}
@keyframes meshC{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(9vmax,12vmax,0) scale(1.25)}100%{transform:translate3d(-12vmax,-6vmax,0) scale(.85)}}
.bg-parts{position:absolute;inset:0}
.bg-p{position:absolute;will-change:transform}
.bg-p > span{display:block;will-change:transform}
.bg-p svg{display:block;width:100%;height:100%}
.aurora{position:absolute;inset:0;z-index:0;background:radial-gradient(80% 60% at 70% 20%,color-mix(in srgb,var(--aqua) 40%,transparent),transparent),radial-gradient(60% 50% at 20% 70%,color-mix(in srgb,var(--aqua-deep) 45%,transparent),transparent),var(--hero-base)}
.aurora canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.hero::before{display:none}
.hero .bubbles{z-index:1}.hero .hero-grid{z-index:2}.hero .smile-edge{position:relative;z-index:2}
.reviews{background:color-mix(in srgb,var(--surface) 72%,transparent)}
.brush-sec{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--aqua) 16%,transparent))}

/* shimmer CTA + animated gradient borders + spotlight + click sparks */
.btn.primary::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-130%);animation:shimmer 3.4s ease-in-out infinite}
@keyframes shimmer{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.sim-panel,.sugar-card,.card,.brush-panel{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ang),var(--aqua-deep),var(--aqua),var(--coral),var(--aqua-deep)) border-box}
@media (hover:hover){.sim-panel:hover,.sugar-card:hover,.card:hover,.brush-panel:hover{animation:spinb 5s linear infinite}}
@keyframes spinb{to{--ang:360deg}}
.svc-item{position:relative;isolation:isolate}
.svc-item::before{content:"";position:absolute;inset:0 -16px;border-radius:22px;z-index:-1;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--aqua) 38%,transparent),transparent 65%);opacity:0;transition:opacity .35s;pointer-events:none}
@media (hover:hover){.svc-item:hover::before{opacity:1}}
.spark-burst{position:fixed;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;z-index:300;overflow:visible}

/* Light Steel palette (default): grays only, stays light even in dark mode */
html[data-palette="steel"][data-palette]{--pearl:#E9ECEF;--surface:#F8F9FA;--ink:#212529;--muted:#495057;--line:rgba(33,37,41,.14);--blush:#DEE2E6;--night:#343A40;--night-2:#495057;--on-night:#F8F9FA;--night-muted:#CED4DA;--aqua:#ADB5BD;--aqua-deep:#495057;--coral:#212529;--on-coral:#F8F9FA;--hero-base:#DEE2E6;color-scheme:light}
html[data-palette="steel"] .hero{background:var(--hero-base)}
html[data-palette="steel"] .hero,html[data-palette="steel"] .process,html[data-palette="steel"] .book,html[data-palette="steel"] .foot{--on-night:var(--ink);--night-muted:var(--muted);color:var(--ink)}
html[data-palette="steel"] .process{background:#DEE2E6}
html[data-palette="steel"] .book,html[data-palette="steel"] .foot{background:#CED4DA}
html[data-palette="steel"] .foot{border-color:var(--line)}
html[data-palette="steel"] .track{background:rgba(10,37,64,.12)}
html[data-palette="steel"] .hours li{border-color:var(--line)}
html[data-palette="steel"] .site-header.on-dark{color:var(--ink)}
html[data-palette="steel"] .on-dark .brand svg{color:var(--aqua-deep)}
html[data-palette="steel"].top-dark body::before{background:var(--hero-base)}
html[data-palette="steel"] .spark{color:var(--coral)}
html[data-palette="steel"] .trust svg{color:var(--aqua-deep)}
html[data-palette="steel"] .btn.primary::before{background:#495057}
html[data-palette="steel"] .bubbles span{border-color:#ADB5BD}

@media (hover:none),(max-width:760px){.bg-mesh::after{display:none}.bg-mesh{animation-duration:24s}.bg-mesh::before{animation-duration:20s}.bubbles span:nth-child(n+6){display:none}}

@media (hover:none),(max-width:760px){
  .bg-mesh::before{display:none}
  .bg-mesh,.bg-mesh::before,.bg-mesh::after{inset:-6vmax}
  .bg-p > span{will-change:auto}
  .aurora::before,.aurora::after{content:"";position:absolute;inset:-25%;pointer-events:none;will-change:transform}
  .aurora::before{background:radial-gradient(38% 26% at 30% 42%,color-mix(in srgb,var(--aqua-deep) 50%,transparent),transparent 70%),radial-gradient(34% 24% at 72% 30%,color-mix(in srgb,var(--aqua) 70%,transparent),transparent 70%);animation:aur1 9s ease-in-out infinite alternate}
  .aurora::after{background:radial-gradient(42% 28% at 58% 68%,color-mix(in srgb,var(--aqua-deep) 35%,transparent),transparent 70%);animation:aur2 12s ease-in-out infinite alternate}
}
@keyframes aur1{to{transform:translate3d(14%,9%,0) rotate(10deg)}}
@keyframes aur2{to{transform:translate3d(-15%,-7%,0) rotate(-12deg)}}
.offscreen,.offscreen *{animation-play-state:paused!important}

/* light-blue palette: the whole site stays light blue (also when the phone is in dark mode) */
:root{--hero-base:var(--night)}
html[data-palette="blue"][data-palette]{--pearl:#E2F1FF;--surface:#FFFFFF;--ink:#0A2540;--muted:#4A6480;--line:rgba(10,37,64,.13);--blush:#CDE6FF;--hero-base:#C4E2FF;color-scheme:light}
html[data-palette="blue"] .hero{background:var(--hero-base)}
html[data-palette="blue"] .hero,html[data-palette="blue"] .process,html[data-palette="blue"] .book,html[data-palette="blue"] .foot{--on-night:var(--ink);--night-muted:var(--muted);color:var(--ink)}
html[data-palette="blue"] .process{background:#D2EAFF}
html[data-palette="blue"] .book,html[data-palette="blue"] .foot{background:#C9E5FF}
html[data-palette="blue"] .foot{border-color:var(--line)}
html[data-palette="blue"] .track{background:rgba(10,37,64,.12)}
html[data-palette="blue"] .hours li{border-color:var(--line)}
html[data-palette="blue"] .site-header.on-dark{color:var(--ink)}
html[data-palette="blue"] .on-dark .brand svg{color:var(--aqua-deep)}
html[data-palette="blue"].top-dark body::before{background:var(--hero-base)}
html[data-palette="blue"] .spark{color:var(--coral)}
html[data-palette="blue"] .trust svg{color:var(--aqua-deep)}

/* progress + palette switcher */
.progress{position:absolute;inset-inline:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--coral),var(--aqua-deep));transform:scaleX(0);transform-origin:right;pointer-events:none}
.pal{position:relative}
.pal-btn{width:46px;height:46px;border-radius:50%;border:2px solid currentColor;background:none;display:grid;place-items:center;padding:0}
.pal-btn span{display:flex}
.pal-btn i{width:10px;height:10px;border-radius:50%;margin-inline:-2px;border:1.5px solid rgba(255,255,255,.7)}
.pal-pop{position:absolute;top:56px;left:0;z-index:5;background:var(--surface);color:var(--ink);border-radius:22px;padding:10px;display:grid;gap:6px;min-width:200px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35);transform-origin:top left}
.pal-pop button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:14px;padding:10px 12px;font-family:var(--display);font-weight:600;font-size:15px;text-align:right}
.pal-pop button:hover,.pal-pop button[aria-pressed="true"]{background:var(--pearl)}
.pal-pop .dots{display:flex}
.pal-pop .dots i{width:18px;height:18px;border-radius:50%;margin-inline-start:-5px;border:2px solid var(--surface)}
.pal-wipe{position:fixed;inset:0;z-index:200;pointer-events:none}
@media (max-width:1080px){.pal{margin-inline-start:auto}.burger{margin-inline-start:0}}

/* hero bubbles */
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbles span{position:absolute;bottom:-40px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--aqua) 60%,transparent);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 60%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(30px)}}

/* marquee */
.marquee{overflow:hidden;background:var(--aqua-deep);color:#fff;padding-block:18px;transform:rotate(-1.6deg);margin-block:-10px 0;position:relative;z-index:2;box-shadow:0 20px 40px -20px color-mix(in srgb,var(--aqua-deep) 70%,transparent)}
.mq-row{overflow:hidden;white-space:nowrap}
.mq-track{display:inline-flex;align-items:center;gap:28px;padding-inline-end:28px;will-change:transform}
.mq-item{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.8rem);line-height:1.3;flex:none}
.mq-track svg{width:clamp(26px,3.4vw,40px);height:auto;flex:none;color:var(--coral)}

/* simulator */
.sim{display:grid;gap:clamp(18px,3vw,32px);margin-top:clamp(28px,4vw,44px);align-items:start}
@media (min-width:980px){.sim{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr)}}
.sim-visual{position:relative;border-radius:36px;background:linear-gradient(160deg,var(--blush),color-mix(in srgb,var(--aqua) 30%,var(--pearl)));padding:clamp(14px,3vw,32px);min-height:clamp(280px,48vw,520px);display:grid;place-items:center;overflow:hidden}
.sim-visual > svg{width:100%;height:auto;max-height:520px;display:block;overflow:visible}
.sim-visual .xray{width:100%;height:clamp(300px,52vw,520px)}
.pt{cursor:pointer;outline:none}
.pt-hl{fill:var(--aqua-deep);opacity:0;transition:opacity .25s}
@media (hover:hover){.pt:hover .pt-hl{opacity:.3}}
.pt:focus-visible .pt-hl{opacity:.4}
.pt.sel .pt-hl{opacity:.55}
.tap{fill:none;stroke:#fff;stroke-width:3}
.sim-hint{position:absolute;top:16px;inset-inline:0;text-align:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);pointer-events:none}
.sim-panel{background:var(--surface);border-radius:30px;padding:clamp(18px,3vw,28px);box-shadow:0 30px 60px -40px rgba(20,10,60,.35)}
.sim-panel h3{font-size:1.35rem;font-weight:800;line-height:1.4}
.sim-panel .sub{color:var(--muted);margin:4px 0 16px;font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;text-align:right;border:1.5px solid var(--line);border-radius:20px;padding:12px;background:var(--pearl);transition:border-color .2s,transform .2s}
@media (hover:hover){.opt:hover{border-color:var(--aqua-deep);transform:translateX(-4px)}}
.opt-ic{width:48px;height:48px;border-radius:16px;background:var(--night);color:var(--aqua);display:grid;place-items:center}
.opt-ic svg{width:26px;height:26px}
.opt b{display:block;font-family:var(--display);font-size:1.02rem}
.opt small{color:var(--muted);font-size:14px}
.opts-label{font-family:var(--display);font-weight:700;font-size:14px;color:var(--aqua-deep);margin:18px 0 8px}
.steps-list{list-style:none;margin:16px 0;padding:0;display:grid;gap:6px}
.steps-list button{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;text-align:right;border:0;background:none;border-radius:14px;padding:8px 10px;font-size:15px;color:var(--muted);transition:background .25s,color .25s}
.steps-list button span:first-child{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--pearl);font-family:var(--display);font-weight:800;font-size:14px;transition:background .25s,color .25s}
.steps-list button.done{color:var(--ink)}
.steps-list button.done span:first-child{background:color-mix(in srgb,var(--aqua-deep) 18%,var(--pearl));color:var(--aqua-deep)}
.steps-list button.cur{background:var(--pearl);color:var(--ink);font-weight:600}
.steps-list button.cur span:first-child{background:var(--aqua-deep);color:#fff}
.step-desc{background:var(--pearl);border-radius:18px;padding:14px 16px;margin:0 0 16px;min-height:4.6em}
.step-desc b{display:block;font-family:var(--display)}
.step-desc span{color:var(--muted);font-size:15px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls .btn{padding:11px 18px;font-size:15px}
.auto{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-inline-start:auto;cursor:pointer}
.auto input{width:18px;height:18px;accent-color:var(--aqua-deep)}
.back-link{border:0;background:none;color:var(--aqua-deep);font-family:var(--display);font-weight:600;padding:8px 0;margin-top:10px;text-decoration:underline;text-underline-offset:4px}
.stage-t{font-family:var(--display);font-weight:800;font-size:20px;fill:#fff}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
/* =========================================================
   بيانات العيادة — غيّرها من هون والموقع كله بيتحدّث
   ========================================================= */
const CLINIC = {
  name: 'عيادة د. محمود دويكات',

function buildTooth(mat){
  const grp = new THREE.Group();
  const g = new THREE.SphereGeometry(1, isMobile ? 72 : 80, isMobile ? 48 : 56); const p = g.attributes.position;
  const cusps = [[.42, .38], [-.42, .38], [.42, -.38], [-.42, -.38]];
  for(let i = 0; i < p.count; i++){
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 1 + .16 * (1 - Math.abs(y)); x *= 1.02 * k; z *= .9 * k;
    if(y > 0){
      let bump = 0; cusps.forEach(([cx, cz]) => { bump += Math.exp(-((x - cx)**2 + (z - cz)**2) / .09); });
      const fiss = Math.min(1, Math.exp(-(x*x) / .012) + Math.exp(-(z*z) / .012));
      y = y * .6 + y * y * (.24 * bump - .09 * fiss);
    } else {
      const t = -y; const taper = 1 - .3 * t; x *= taper; z *= taper; y *= .85;
    }
    p.setXYZ(i, x, y, z);
  }
  g.computeVertexNormals();
  grp.add(new THREE.Mesh(g, mat));
  const root = side => {
    const rg = new THREE.CylinderGeometry(.36, .1, 2.1, 36, 18); const rp = rg.attributes.position;
    for(let i = 0; i < rp.count; i++){ const y = rp.getY(i); const t = (1.05 - y) / 2.1; rp.setX(i, rp.getX(i) + side * .22 * t * t); rp.setZ(i, rp.getZ(i) - .06 * t); }
    rg.computeVertexNormals();
    const m = new THREE.Mesh(rg, mat); m.position.set(side * .4, -1.45, 0); m.rotation.z = side * .08; return m;
  };
  grp.add(root(1), root(-1));
  return grp;
}

    const resize = () => { const w = el.clientWidth, h = el.clientHeight; if(!w || !h) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.fov = w < 520 ? 34 : 30; cam.updateProjectionMatrix(); };
    resize(); const ro = new ResizeObserver(resize); ro.observe(el);

    const tilt = { x: 0, y: 0 }, target = { x: 0, y: 0 };
    const pmove = e => { target.x = (e.clientX / window.innerWidth - .5) * 2; target.y = (e.clientY / window.innerHeight - .5) * 2; };
    if(finePointer) window.addEventListener('pointermove', pmove);
    let visible = true; const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; }); io.observe(el);
    let raf, last = 0; const t0 = performance.now();
    const loop = () => {
      raf = requestAnimationFrame(loop);
      if(!visible) return;
      const now = performance.now();
      const t = (now - t0) / 1000;
      const sp = Math.min(1, window.scrollY / Math.max(1, el.closest('.hero').offsetHeight));
      tilt.x += (target.x - tilt.x) * .06; tilt.y += (target.y - tilt.y) * .06;
      const still = reduceMotion ? 0 : 1;
      tooth.scale.setScalar(state.s * (1 - sp * .15));
      tooth.rotation.y = state.spin + still * (t * .35 + sp * 3) - tilt.x * .5;
      tooth.rotation.x = .2 + tilt.y * .3 + sp * .5;
      tooth.rotation.z = -.08 + still * Math.sin(t * .7) * .05;
      tooth.position.y = .62 + still * Math.sin(t * 1.3) * .09 - sp * .6;

    };
    loop();
    startRef.current = () => {
      if(!FX) return;
      gsap.to(state, { s: 1, duration: 1.6, ease: 'elastic.out(1,.55)' });
      gsap.to(state, { spin: 0, duration: 2.2, ease: 'expo.out' });
    };
    return () => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); window.removeEventListener('pointermove', pmove); window.removeEventListener('palette', tint); renderer.dispose(); pm.dispose(); envTex.dispose(); el.removeChild(renderer.domElement); };
  }, []);
  const sparks = [[12, 18, 1], [80, 12, .7], [88, 58, .9], [8, 70, .6], [70, 86, .8], [30, 6, .5], [52, 92, .6]];
  return html`<div className="hero-3d" ref=${host} role="img" aria-label="مجسّم سن">
    <div className="glow"></div>
    <svg className="fallback" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#ffffff"/><stop offset="1" stopColor="#bfe9e3"/></linearGradient></defs><path d=${TOOTH} fill="url(#fb)"/></svg>
    ${sparks.map(([x, y, s], i) => html`<span key=${i} className="spark" style=${{ left: x + '%', top: y + '%', transform: `scale(${s})` }}><${Star4}/></span>`)}

/* =================== aurora background (React Bits style, WebGL) =================== */
const AURORA_FRAG = `
uniform float uTime; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3; uniform vec3 uBase; varying vec2 vUv;
vec3 permute(vec3 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy)); vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod(i, 289.0);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0); m = m*m; m = m*m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0; vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5); vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g; g.x = a0.x*x0.x + h.x*x0.y; g.yz = a0.yz*x12.xz + h.yz*x12.yw;
  return 130.0 * dot(m, g);
}
void main(){
  vec2 uv = vUv; float t = uTime * 0.2;
  vec3 col = uBase;
  for(int k = 0; k < 3; k++){
    float fk = float(k);
    float n = snoise(vec2(uv.x * (1.5 + fk*0.5) + t * (1.0 + fk*0.35) + fk*3.7, t*0.7 + fk*1.9));
    float n2 = snoise(vec2(uv.x * 4.0 - t*1.3 + fk, t*0.5));
    float hgt = 0.66 + 0.16*n + 0.04*n2 - fk*0.15;
    float d = uv.y - hgt;
    float band = exp(-d*d*(16.0 + fk*8.0));
    float curtain = exp(-max(-d, 0.0) * 5.0) * (1.0 - smoothstep(-0.02, 0.08, d));
    vec3 c = (k == 0) ? uC1 : ((k == 1) ? uC2 : uC3);
    float a = clamp(band * (0.6 - fk*0.12) + curtain * 0.22 * (1.0 - fk*0.3) * (0.6 + 0.4*n2), 0.0, 1.0);
    col = mix(col, c, a * (k == 2 ? 0.3 : 1.0));
  }
  float vig = 1.0 - smoothstep(0.25, 1.25, length((uv - vec2(0.5, 0.42)) * vec2(1.2, 1.0)));
  col = mix(uBase * 0.94, col, 0.65 + 0.35*vig);
  col = mix(col, uBase, smoothstep(0.5, 1.0, uv.x) * 0.4);
  gl_FragColor = vec4(col, 1.0);
}`;
function AuroraBG(){
  const host = useRef();
  useEffect(() => {
    const el = host.current;
    if(!window.THREE || reduceMotion || isMobile) return;
    let r; try { r = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'low-power' }); } catch(e){ return; }
    if(!r.getContext()) return;
    r.setPixelRatio(1); el.appendChild(r.domElement);
    const U = { uTime: { value: 0 }, uC1: { value: new THREE.Color() }, uC2: { value: new THREE.Color() }, uC3: { value: new THREE.Color() }, uBase: { value: new THREE.Color() } };
    const read = () => [cssVar('--aqua'), cssVar('--aqua-deep'), cssVar('--coral'), cssVar('--hero-base') || cssVar('--night')].map(c => new THREE.Color(c || '#000'));
    const [a, b, c, base] = read(); U.uC1.value.copy(a); U.uC2.value.copy(b); U.uC3.value.copy(c); U.uBase.value.copy(base);
    const repaint = () => { const cols = read(); [U.uC1, U.uC2, U.uC3, U.uBase].forEach((u, i) => { if(FX) gsap.to(u.value, { r: cols[i].r, g: cols[i].g, b: cols[i].b, duration: 1.2, ease: 'power2.inOut' }); else u.value.copy(cols[i]); }); };
    window.addEventListener('palette', repaint);
    const mat = new THREE.ShaderMaterial({ uniforms: U, vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }', fragmentShader: AURORA_FRAG });
    const scene = new THREE.Scene(); const cam = new THREE.Camera(); scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    const k = isMobile ? .25 : .45;
    const resize = () => { const w = el.clientWidth, h = el.clientHeight; if(w && h) r.setSize(Math.max(2, Math.round(w * k)), Math.max(2, Math.round(h * k)), false); };
    resize(); const ro = new ResizeObserver(resize); ro.observe(el);
    let vis = true; const io = new IntersectionObserver(([e]) => { vis = e.isIntersecting; }); io.observe(el);
    let raf, last = 0; const t0 = performance.now();
    const loop = () => { raf = requestAnimationFrame(loop); if(!vis) return; const now = performance.now(); U.uTime.value = (now - t0) / 1000; r.render(scene, cam); };
    loop();
    if(FX) gsap.from(r.domElement, { opacity: 0, duration: 1.6, ease: 'power2.out' });
    return () => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); window.removeEventListener('palette', repaint); mat.dispose(); r.dispose(); el.removeChild(r.domElement); };
  }, []);
  return html`<div className="aurora" ref=${host} aria-hidden="true"></div>`;
}

      s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';

function Marquee(){
  const ref = useRef();
  const items = ['تبييض', 'تقويم شفاف', 'زراعة', 'علاج عصب', 'حشوات تجميلية', 'فينير', 'تنظيف', 'أسنان أطفال'];
  useEffect(() => {
    if(!FX) return;
    const tr = ref.current.querySelector('.mq-track'); let x = 0, w = tr.scrollWidth / 2, vel = 0, boost = 0, vis = true;
    const measure = () => { w = tr.scrollWidth / 2; }; fontsReady.then(measure); window.addEventListener('resize', measure);
    const io = new IntersectionObserver(([e]) => { vis = e.isIntersecting; }); io.observe(ref.current);
    let st; if(window.ScrollTrigger) st = ScrollTrigger.create({ onUpdate: s => { vel = s.getVelocity(); } });
    const tick = (t, dt) => {
      if(!vis) return;
      boost += (vel / 1000 - boost) * .1; vel *= .9;
      x -= (1.2 + Math.abs(boost) * 6) * (boost < -.05 ? -1 : 1) * dt * .06;
      x = gsap.utils.wrap(-w, 0, x);
      gsap.set(tr, isMobile ? { x, force3D: true } : { x, skewX: gsap.utils.clamp(-12, 12, -boost * 4), force3D: true });
    };
    gsap.ticker.add(tick);
    return () => { gsap.ticker.remove(tick); io.disconnect(); st && st.kill(); window.removeEventListener('resize', measure); };
  }, []);
  const seq = [...items, ...items];
  const half = seq.map((t, i) => html`<${React.Fragment} key=${i}><span className="mq-item">${t}</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d=${TOOTH} fill="currentColor"/></svg></${React.Fragment}>`);
  return html`<div className="marquee" ref=${ref} aria-hidden="true"><div className="mq-row" dir="ltr"><div className="mq-track" dir="rtl">${half}${half}</div></div></div>`;
}

const CROOK = [[5, 3, 3], [-6, -4, -2], [4, 7, 4], [-9, -2, -5], [9, 5, 6], [-6, 8, -6], [11, -6, 3], [-5, 4, -4], [6, -3, 2], [-4, 5, -3]];
const GUM_EDGE = (() => { const ts = [...UPPER].sort((a, b) => a.dx - b.dx); let d = ''; ts.forEach((t, j) => { const l = 300 + t.dx - t.w / 2 - 1, r = 300 + t.dx + t.w / 2 + 1; const Pl = zenU(t.dx - t.w / 2) + 15, Pr = zenU(t.dx + t.w / 2) + 15; const Z = zenU(t.dx) - 3; const C = 2 * Z - (Pl + Pr) / 2; d += (j ? ` L${l},${Pl}` : `M${l},${Pl}`) + ` Q${300 + t.dx},${C} ${r},${Pr}`; }); return d; })();
function applyOrtho(root, k){
  const pts = [];
  root.querySelectorAll('.ot').forEach(g => {
    const i = +g.dataset.k; const t = UP_D[i]; const [r, dy, dx] = CROOK[i]; const f = 1 - k;
    const cx = t.cx, cy = t.y + t.hh / 2;
    g.setAttribute('transform', `translate(${(dx * f).toFixed(2)} ${(dy * f).toFixed(2)}) rotate(${(r * f).toFixed(2)} ${cx} ${cy})`);
    const bx = t.cx, by = t.y + t.hh * .58, a = r * f * Math.PI / 180;
    pts.push([cx + (bx - cx) * Math.cos(a) - (by - cy) * Math.sin(a) + dx * f, cy + (bx - cx) * Math.sin(a) + (by - cy) * Math.cos(a) + dy * f]);
  });
  pts.sort((p, q) => p[0] - q[0]);
  const w = root.querySelector('.wire'); if(w) w.setAttribute('d', 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L'));
}

function Simulator(){
  const [phase, setPhase] = useState('pick');   // pick | play
  const [tooth, setTooth] = useState(null);
  const [treat, setTreat] = useState(null);
  const [step, setStep] = useState(0);
  const [auto, setAuto] = useState(true);
  const pickSvg = useRef(); const stage = useRef(); const tl = useRef(); const tw = useRef(); const timer = useRef();
  const autoRef = useRef(auto); autoRef.current = auto;
  const treatRef = useRef(treat); treatRef.current = treat;

  // tap hint on the pick screen
  useEffect(() => {
    if(phase !== 'pick' || !FX || !pickSvg.current) return;
    gsap.fromTo(pickSvg.current, { scale: .9, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: .8, ease: 'expo.out', clearProps: 'transform' });
    const taps = pickSvg.current.querySelectorAll('.tap');
    const t = taps.length ? gsap.fromTo(taps, { scale: .4, opacity: 1, transformOrigin: '50% 50%' }, { scale: 2.6, opacity: 0, duration: 1.4, stagger: .7, repeat: -1, ease: 'power1.out' }) : null;
    return () => { t && t.kill(); };
  }, [phase, tooth == null]);

  const onPick = k => {
    setTooth(k);
    if(FX){
      const g = pickSvg.current.querySelector(`.pt[data-k="${k}"]`);
      gsap.fromTo(g, { y: 0 }, { y: -10, duration: .18, yoyo: true, repeat: 1, ease: 'power2.out' });
      setTimeout(() => { const opts = document.querySelectorAll('.sim-panel .opt'); gsap.from(opts, { x: -40, autoAlpha: 0, duration: .6, stagger: .07, ease: 'expo.out' }); }, 0);
    }
  };

  const playStep = i => {
    const t = tl.current; if(!t) return;
    clearTimeout(timer.current); tw.current && tw.current.kill();
    const n = TREAT[treatRef.current].steps.length;
    setStep(i);
    const a = 's' + i, b = i + 1 < n ? 's' + (i + 1) : 'end';
    t.pause(); t.seek(a, false);
    if(!FX){ t.seek(b, false); return; }
    tw.current = t.tweenFromTo(a, b, { onComplete: () => { if(autoRef.current && i + 1 < n) timer.current = setTimeout(() => playStep(i + 1), 1300); } });
  };

  const start = key => {
    const zoomTooth = TOOTH_TREATS.includes(key) && tooth != null;
    const go2 = () => { setTreat(key); setStep(0); setPhase('play'); };
    if(FX && pickSvg.current){
      const t = zoomTooth ? UP_D[tooth] : null;
      const ox = t ? (t.cx / 600 * 100) + '%' : '50%', oy = t ? ((t.y + t.hh / 2) / 300 * 100) + '%' : '50%';
      gsap.to(pickSvg.current, { scale: zoomTooth ? 3.4 : 1.2, autoAlpha: 0, transformOrigin: `${ox} ${oy}`, duration: .7, ease: 'power3.in', onComplete: go2 });
    } else go2();
  };

  useEffect(() => {
    if(phase !== 'play' || !treat) return;
    const root = stage.current; const svg = root.tagName === 'svg' ? root : root;
    if(FX) gsap.fromTo(root.closest('.sim-visual').firstElementChild, { scale: .55, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 1, ease: 'elastic.out(1,.65)' });
    if(!hasGsap){ return; }
    tl.current = BUILD[treat](svg);
    const t0 = setTimeout(() => playStep(0), FX ? 650 : 0);
    if(FX) setTimeout(() => gsap.from(document.querySelectorAll('.steps-list li'), { x: -30, autoAlpha: 0, duration: .5, stagger: .05, ease: 'expo.out' }), 0);
    return () => { clearTimeout(t0); clearTimeout(timer.current); tw.current && tw.current.kill(); tl.current && tl.current.kill(); tl.current = null; };
  }, [phase, treat]);

  useEffect(() => { if(!auto) clearTimeout(timer.current); }, [auto]);

  const back = () => { clearTimeout(timer.current); setPhase('pick'); setTreat(null); };
  const T = treat ? TREAT[treat] : null; const n = T ? T.steps.length : 0;
  const toothOpts = [
    { k: 'filling', t: 'تسوّس', s: 'العلاج: حشوة تجميلية' },
    { k: 'rootcanal', t: 'ألم قوي بالسن', s: 'العلاج: علاج عصب' },
    { k: 'implant', t: 'سن مكسور أو مفقود', s: 'العلاج: زراعة' }
  ];
  const mouthOpts = [
    { k: 'whitening', t: 'أسنان مصفرّة', s: 'العلاج: تبييض' },
    { k: 'ortho', t: 'أسنان مش مرتبة', s: 'العلاج: تقويم' }
  ];
  const Opt = o => html`<button key=${o.k} className="opt" onClick=${() => start(o.k)}><span className="opt-ic">${OPT_ICON[o.k]}</span><span><b>${o.t}</b><small>${o.s}</small></span></button>`;

  return html`<section id="simulator">
    <div className="wrap">
      <h2 data-split>جرّب العلاج بنفسك</h2>
      <p className="lead" data-reveal>اكبس على أي سن واختار المشكلة، وشوف خطوات العلاج قدامك خطوة بخطوة. أو اختار علاج للفم كامل.</p>
      <div className="sim">
        <div className="sim-visual">
          ${phase === 'pick'
            ? html`<${PickSmile} sel=${tooth} onPick=${onPick} svgRef=${pickSvg}/>`
            : (TOOTH_TREATS.includes(treat) ? html`<${ToothStage} key=${treat} mode=${treat} rootRef=${stage}/>` : html`<${SmileStage} key=${treat} mode=${treat} rootRef=${stage}/>`)}
          ${phase === 'pick' && tooth == null && html`<div className="sim-hint">اكبس على أي سن من فوق</div>`}
        </div>
        <div className="sim-panel" aria-live="polite">
          ${phase === 'pick' ? html`<div>
              <h3>${tooth == null ? 'شو بتحس فيه؟' : 'اخترت: ' + TNAME[UP_D[tooth].i]}</h3>
              <p className="sub">${tooth == null ? 'اختار سن من الصورة، أو علاج للفم كامل من تحت.' : 'شو المشكلة بهالسن؟'}</p>
              ${tooth != null && html`<div className="opts">${toothOpts.map(Opt)}</div>`}
              <p className="opts-label">للفم كامل</p>
              <div className="opts">${mouthOpts.map(Opt)}</div>
            </div>` : html`<div>
              <h3>${T.t}</h3>
              <p className="sub">الخطوة ${step + 1} من ${n}</p>
              <ol className="steps-list">${T.steps.map((s, i) => html`<li key=${i}><button className=${i === step ? 'cur' : i < step ? 'done' : ''} onClick=${() => playStep(i)}><span>${i + 1}</span><span>${s.t}</span></button></li>`)}</ol>
              <p className="step-desc"><b>${T.steps[step].t}</b><span>${T.steps[step].d}</span></p>
              <div className="ctrls">
                <button className="btn" disabled=${step === 0} onClick=${() => playStep(Math.max(0, step - 1))}>السابق</button>
                ${step + 1 < n
                  ? html`<button className="btn primary" onClick=${() => playStep(step + 1)}>التالي</button>`
                  : html`<button className="btn primary" onClick=${() => playStep(0)}>من البداية</button>`}
                <label className="auto"><input type="checkbox" checked=${auto} onChange=${e => setAuto(e.target.checked)}/>تشغيل تلقائي</label>
              </div>
              <button className="back-link" onClick=${back}>جرّب علاج ثاني</button>
            </div>`}
        </div>
      </div>
    </div>
  </section>`;
}

  const ref = useRef(); const tl = useRef();

    const el = ref.current;
    if(!FX){ el.classList.toggle('open', open); return; }
    if(open){
      el.classList.add('open'); tl.current && tl.current.kill();
      tl.current = gsap.timeline()
        .fromTo(el, { clipPath: 'circle(0% at 8% 4%)' }, { clipPath: 'circle(150% at 8% 4%)', duration: .75, ease: 'power3.inOut' })
        .from(el.querySelectorAll('nav a, .menu .btn'), { yPercent: 90, autoAlpha: 0, duration: .6, stagger: .06, ease: 'expo.out' }, '-=.35');

      tl.current = gsap.to(el, { clipPath: 'circle(0% at 8% 4%)', duration: .5, ease: 'power3.inOut', onComplete: () => el.classList.remove('open') });

/* ---------- sugar & acidity ---------- */
const T0 = 7 * 60, T1 = 23 * 60, STEP_MIN = 4;
const EVENTS = { meals: [8 * 60, 14 * 60, 20 * 60], snacks: [8 * 60, 10 * 60, 11 * 60 + 30, 14 * 60, 16 * 60, 17 * 60 + 30, 20 * 60, 22 * 60] };
const phAt = (t, ev) => { let d = 0; ev.forEach(e => { const x = t - e; if(x < 0) return; d = Math.max(d, x < 6 ? x / 6 : Math.exp(-(x - 6) / 30)); }); return 7 - 2.2 * d; };
const SAMPLES = []; for(let t = T0; t <= T1; t += STEP_MIN) SAMPLES.push(t);
const PH = { meals: SAMPLES.map(t => phAt(t, EVENTS.meals)), snacks: SAMPLES.map(t => phAt(t, EVENTS.snacks)) };
const DANGER = { meals: 0, snacks: 0 };
['meals', 'snacks'].forEach(m => { let c = 0; for(let t = T0; t <= T1; t++) if(phAt(t, EVENTS[m]) < 5.5) c++; DANGER[m] = c; });
const cxT = t => 50 + (t - T0) / (T1 - T0) * 570;
const cyP = ph => 24 + (7.3 - ph) / (7.3 - 4.5) * 206;
const pathFrom = arr => arr.map((v, i) => (i ? 'L' : 'M') + cxT(SAMPLES[i]).toFixed(1) + ',' + cyP(v).toFixed(1)).join(' ');

function Sugar(){
  const [mode, setMode] = useState('meals');
  const ref = useRef(); const st = useRef({ k: 0 }); const numRef = useRef(); const segRef = useRef();
  const draw = () => {
    const k = st.current.k; const arr = PH.meals.map((v, i) => v * (1 - k) + PH.snacks[i] * k);
    const d = pathFrom(arr);
    ref.current.querySelectorAll('.curve').forEach(p => p.setAttribute('d', d));
    ref.current.querySelector('.area').setAttribute('d', d + ` L620,230 L50,230 Z`);
  };
  const movePill = (anim) => {
    const seg = segRef.current; const b = seg.querySelectorAll('button')[mode === 'meals' ? 0 : 1]; const pill = seg.querySelector('.seg-pill');
    const v = { x: b.offsetLeft - 4, width: b.offsetWidth };
    if(FX && anim) gsap.to(pill, { ...v, duration: .6, ease: 'elastic.out(1,.7)' }); else { pill.style.width = v.width + 'px'; pill.style.transform = `translateX(${v.x}px)`; }
  };
  useEffect(() => {
    draw(); movePill(false); fontsReady.then(() => movePill(false));
    if(FX && window.ScrollTrigger){
      const curves = ref.current.querySelectorAll('.curve');
      const tl = gsap.timeline({ scrollTrigger: { trigger: ref.current, start: 'top 75%', once: true } });
      tl.fromTo(curves, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.2, ease: 'power2.inOut', onComplete: () => curves.forEach(c => { c.style.strokeDasharray = 'none'; }) })
        .from(ref.current.querySelector('.area'), { autoAlpha: 0, duration: 1 }, 1.4)
        .from(ref.current.querySelectorAll('.ev'), { scale: 0, transformOrigin: '50% 50%', duration: .6, stagger: .12, ease: 'back.out(3)' }, .3);
      const o = { n: 0 }; tl.to(o, { n: DANGER.meals, duration: 2, ease: 'power2.out', onUpdate: () => { numRef.current.textContent = Math.round(o.n); } }, 0);
    }
  }, []);
  useEffect(() => { movePill(true); }, [mode]);
  const pick = m => {
    if(m === mode) return; setMode(m);
    const k = m === 'snacks' ? 1 : 0; const o = { n: +numRef.current.textContent || 0 };
    if(FX){
      gsap.to(st.current, { k, duration: 1.2, ease: 'power3.inOut', onUpdate: draw });
      gsap.to(o, { n: DANGER[m], duration: 1.2, ease: 'power3.inOut', onUpdate: () => { numRef.current.textContent = Math.round(o.n); } });
      gsap.fromTo(numRef.current, { scale: 1.6 }, { scale: 1, duration: .9, ease: 'elastic.out(1,.45)' });
      setTimeout(() => gsap.fromTo(ref.current.querySelectorAll('.ev'), { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: .6, stagger: .06, ease: 'back.out(3)' }), 0);
    } else { st.current.k = k; draw(); numRef.current.textContent = DANGER[m]; }
  };
  return html`<section id="sugar">
    <div className="wrap">
      <h2 data-split>مش كمية السكر، عدد المرّات</h2>
      <p className="lead" data-reveal>كل مرة بتاكل أو بتشرب إشي فيه سكر، فمك بيصير حامضي وبياخذ تقريباً ساعة ليرجع طبيعي. تحت خط الخطر، المينا بتخسر من معادنها.</p>
      <div className="sugar-card" data-reveal>
        <div className="sugar-top">

            <span className="seg-pill" aria-hidden="true"></span>
            <button aria-pressed=${mode === 'meals'} onClick=${() => pick('meals')}>3 وجبات</button>
            <button aria-pressed=${mode === 'snacks'} onClick=${() => pick('snacks')}>سناكات طول اليوم</button>
          </div>
          <div className="danger"><b ref=${numRef}>${DANGER.meals}</b>دقيقة تحت خط الخطر</div>
        </div>
        <svg className="chart" viewBox="0 0 640 285" ref=${ref} role="img" aria-label="رسم لدرجة حموضة الفم خلال اليوم">
          <defs>
            <clipPath id="below"><rect x="0" y=${cyP(5.5)} width="640" height="300"/></clipPath>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#0E8F8A" stopOpacity=".35"/><stop offset="1" stopColor="#0E8F8A" stopOpacity="0"/></linearGradient>
          </defs>
          <rect className="zone" x="50" y=${cyP(5.5)} width="570" height=${230 - cyP(5.5)} rx="8"/>
          <path className="area"/>

          <line className="axis" x1="50" x2="620" y1="230" y2="230"/>
          <text x="44" y=${cyP(7) + 4} textAnchor="end">7</text>
          <text x="44" y=${cyP(5.5) + 4} textAnchor="end">5.5</text>
          <text x="614" y=${cyP(5.5) + 20} textAnchor="end" style=${{ fill: 'var(--coral)', fontWeight: 600 }}>خط الخطر</text>
          ${[[8, '8 ص'], [12, '12 ظ'], [16, '4 م'], [20, '8 م']].map(([h, t]) => html`<text key=${h} x=${cxT(h * 60)} y="252" textAnchor="middle">${t}</text>`)}
          <path className="curve" pathLength="1"/>
          <path className="curve hot" pathLength="1" clipPath="url(#below)"/>
          ${EVENTS[mode].map(e => html`<circle key=${mode + e} className="ev" cx=${cxT(e)} cy="272" r="7"/>`)}
        </svg>

      </div>
    </div>
  </section>`;

              </div>
            </div>
            <div className="field full"><label htmlFor="b-notes">ملاحظات (اختياري)</label><textarea id="b-notes" placeholder="مثلاً: عندي ألم بسن من يومين" value=${f.notes} onInput=${set('notes')}></textarea></div>
            ${err && html`<p className="form-error" role="alert">${err}</p>`}
            <button className="btn primary magnetic" onClick=${submit}><${WaIcon}/>احجز عبر واتساب</button>
          </div>`}
      </div>
    </div>
  </section>`;
}

function WaFloat(){
  const ref = useRef();
  useEffect(() => {
    const f = () => ref.current && ref.current.classList.toggle('show', window.scrollY > window.innerHeight * .8);
    f(); window.addEventListener('scroll', f, { passive: true });
    return () => window.removeEventListener('scroll', f);
  }, []);
  const href = CLINIC.whatsapp ? 'https://wa.me/' + CLINIC.whatsapp : '#book';
  return html`<a className="wa" ref=${ref} href=${href} target=${CLINIC.whatsapp ? '_blank' : undefined} rel="noopener" aria-label="احجز عبر واتساب"
    onClick=${e => { if(!CLINIC.whatsapp){ e.preventDefault(); go('book'); } }}><${WaIcon}/></a>`;
}

/* ---------- app + scroll choreography ---------- */
function App(){
  const [menu, setMenu] = useState(false);
  useEffect(() => {
    const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('offscreen', !e.isIntersecting)), { rootMargin: '120px 0px' });
    document.querySelectorAll('main > section').forEach(sec => io.observe(sec));
    return () => io.disconnect();
  }, []);
  useClickSpark();
  useEffect(() => {
    if(!finePointer) return;
    const f = e => { const it = e.target.closest && e.target.closest('.svc-item'); if(!it) return; const r = it.getBoundingClientRect(); it.style.setProperty('--mx', (e.clientX - r.left) + 'px'); it.style.setProperty('--my', (e.clientY - r.top) + 'px'); };
    window.addEventListener('pointermove', f, { passive: true }); return () => window.removeEventListener('pointermove', f);
  }, []);
  useEffect(() => {
    if(reduceMotion || !window.Lenis || isMobile) return;
    const lenis = new Lenis({ duration: 1.15, smoothWheel: true });
    window.__lenis = lenis;
    let tick;
    if(hasGsap){ if(window.ScrollTrigger) lenis.on('scroll', ScrollTrigger.update); tick = t => lenis.raf(t * 1000); gsap.ticker.add(tick); gsap.ticker.lagSmoothing(0); }
    else { const raf = t => { lenis.raf(t); tick = requestAnimationFrame(raf); }; tick = requestAnimationFrame(raf); }
    return () => { hasGsap ? gsap.ticker.remove(tick) : cancelAnimationFrame(tick); lenis.destroy(); window.__lenis = null; };
  }, []);
  useEffect(() => {
    const l = window.__lenis; if(l){ menu ? l.stop() : l.start(); }
    document.documentElement.style.overflow = menu ? 'hidden' : '';
  }, [menu]);

  useEffect(() => {
    if(!FX || !window.ScrollTrigger) return;
    let ctx, alive = true;
    fontsReady.then(() => {
      if(!alive) return;
      ctx = gsap.context(() => {
        document.querySelectorAll('[data-split]').forEach(el => {
          const words = window.SplitText ? new SplitText(el, { type: 'words', mask: 'words' }).words : [el];
          gsap.from(words, { yPercent: 125, rotate: 7, transformOrigin: 'right bottom', duration: 1.1, stagger: .07, ease: 'expo.out', scrollTrigger: { trigger: el, start: 'top 88%' } });
        });
        document.querySelectorAll('[data-reveal]').forEach(el => gsap.from(el, { y: 40, autoAlpha: 0, duration: 1, ease: 'expo.out', scrollTrigger: { trigger: el, start: 'top 90%' } }));
        ScrollTrigger.batch('.svc-item', { start: 'top 90%', once: true, onEnter: b => {
          gsap.from(b, { x: -60, autoAlpha: 0, duration: .9, stagger: .08, ease: 'expo.out' });
          gsap.from(b.map(x => x.querySelector('.svc-icon')), { scale: 0, rotate: -40, duration: .9, stagger: .08, ease: 'back.out(2.4)' });
          b.forEach((x, i) => gsap.fromTo(x.querySelectorAll('.svc-icon path, .svc-icon circle'), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.2, delay: .2 + i * .08, ease: 'power2.inOut' }));
        } });
        gsap.to('.track-fill', { scaleY: 1, ease: 'none', scrollTrigger: { trigger: '.steps', start: 'top 70%', end: 'bottom 60%', scrub: isMobile ? true : .5 } });
        gsap.utils.toArray('.step').forEach(st => {
          ScrollTrigger.create({ trigger: st, start: 'top 65%', onEnter: () => { st.classList.add('on'); gsap.fromTo(st.querySelector('.step-num'), { scale: .5 }, { scale: 1, duration: .8, ease: 'elastic.out(1,.4)' }); }, onLeaveBack: () => st.classList.remove('on') });
          gsap.from(st.querySelectorAll('h3, p'), { x: -50, autoAlpha: 0, duration: .9, stagger: .08, ease: 'expo.out', scrollTrigger: { trigger: st, start: 'top 85%' } });
        });
        gsap.from('.quote', { y: 70, autoAlpha: 0, duration: 1, stagger: .14, ease: 'expo.out', scrollTrigger: { trigger: '.quotes', start: 'top 85%' } });
        gsap.from('.quote > svg', { scale: 0, rotate: -60, duration: 1, stagger: .14, ease: 'back.out(2.5)', scrollTrigger: { trigger: '.quotes', start: 'top 85%' } });
        gsap.from('.faq-item', { y: 30, autoAlpha: 0, duration: .7, stagger: .06, ease: 'expo.out', scrollTrigger: { trigger: '.faq-list', start: 'top 88%' } });
        gsap.from('.card', { y: 70, rotate: -1.5, autoAlpha: 0, duration: 1.1, ease: 'expo.out', scrollTrigger: { trigger: '.card', start: 'top 88%' } });
        gsap.from('.form .field, .form .btn', { y: 26, autoAlpha: 0, duration: .7, stagger: .06, ease: 'expo.out', scrollTrigger: { trigger: '.card', start: 'top 80%' } });
        gsap.to('.progress', { scaleX: 1, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: .3 } });
        gsap.to('.bg-mesh-rot', { rotation: 40, scale: 1.2, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: 1.2 } });
        ScrollTrigger.refresh();
      });
    });
    return () => { alive = false; ctx && ctx.revert(); };
  }, []);

  useEffect(() => {
    if(!FX || !finePointer) return;
    const offs = [];
    document.querySelectorAll('.magnetic').forEach(el => {
      const xTo = gsap.quickTo(el, 'x', { duration: .6, ease: 'elastic.out(1,.4)' }), yTo = gsap.quickTo(el, 'y', { duration: .6, ease: 'elastic.out(1,.4)' });
      const mm = e => { const r = el.getBoundingClientRect(); xTo((e.clientX - (r.left + r.width / 2)) * .3); yTo((e.clientY - (r.top + r.height / 2)) * .4); };
      const ml = () => { xTo(0); yTo(0); };
      el.addEventListener('mousemove', mm); el.addEventListener('mouseleave', ml);
      offs.push(() => { el.removeEventListener('mousemove', mm); el.removeEventListener('mouseleave', ml); });
    });
    return () => offs.forEach(f => f());
  }, []);

  return html`<div>
    <div className="bg-mesh-wrap" aria-hidden="true" style=${{ position: 'fixed', inset: 0, zIndex: -1, pointerEvents: 'none', overflow: 'hidden' }}><div className="bg-mesh-rot" style=${{ position: 'absolute', inset: 0 }}><div className="bg-mesh"></div></div><${BgParticles}/></div>
    <${Header} onMenu=${() => setMenu(true)}/>
    <main>
      <${Hero}/>
      <${Simulator}/>
      <${Compare}/>
      <${ToothStory}/>
      <${Brushing}/>
      <${Habits}/>
      <${Visit}/>
      <${Services}/>
      <${Doctor}/>
      <${Faq}/>
      <${Book}/>
    </main>
    <footer className="foot"><div className="wrap"><span>${CLINIC.name} ${CLINIC.tagline}، ${CLINIC.city}</span><span>© 2026</span></div></footer>
    <${WaFloat}/>
    <${Menu} open=${menu} onClose=${() => setMenu(false)}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

</script>
</body>
</html>
